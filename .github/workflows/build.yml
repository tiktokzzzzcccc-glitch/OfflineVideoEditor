name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p project

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE="$(find . -type f -iname '*.zip' -print -quit || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
          else
            echo "No ZIP found. Checking repository directly..."
            cp -R . project/direct 2>/dev/null || true
          fi

          echo "Searching for Gradle project..."

          GRADLEW="$(find project -type f -name 'gradlew' -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Project contents:"
            find project -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVideoEditor-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
